version: ${project.version}
stats: true
storage:
  # Set this to "sql" if you want to use SQL.
  type: yaml
  # These settings do nothing if you're not using SQL.
  # Supported databases: MySQL, MariaDB
  database:
    address: localhost
    port: 3306
    name: chatcolor_db
    user: database_user
    password: database_password
settings:
  event-priority: LOWEST
  auto-save: true
  save-interval: 10
  color-override: false
  notify-others: true
  join-message: true
  confirm-timeout: 15
  default-color: '&f'
  command-name: chatcolor
  force-group-colors: true
  default-color-enabled: true
  command-opens-gui: false
  ignore-symbol-prefixes: true
  remove-inaccessible-colors: false
  # On Paper (and forks such as Folia), also re-apply the colour when the chat line is rendered.
  # Other chat plugins strip formatting players have no permission for (EssentialsX does this), which
  # otherwise removes the colour ChatColor applied. This puts it back, after everything else has run.
  # Set this to false to only use the chat event. Requires a server restart to take effect.
  use-modern-chat-event: true
placeholders:
  - '[item]'
default:
  code: 1
  color: '&f'